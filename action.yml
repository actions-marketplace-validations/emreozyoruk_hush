name: "Hush Issue Triage"
description: "Issue and pull request triage that stays quiet when it is not sure. Calibrated labels, spam, duplicates, and PR risk flags."
author: "Emre Özyörük"
branding:
  icon: "volume-x"
  color: "purple"

inputs:
  typesafe-api-key:
    description: "TypeSafe API key. Get one at https://console.typesafe.ai/keys"
    required: true
  github-token:
    description: "Token used to read issues and apply labels."
    required: false
    default: ${{ github.token }}
  apply:
    description: "Apply labels. Leave false to watch what it would do first."
    required: false
    default: "false"
  comment:
    description: "Post a comment explaining what was applied and what it stayed quiet on."
    required: false
    default: "false"
  labels:
    description: >
      JSON object of label name → what that label means. The description is what the
      model judges against, so write it the way you would explain it to a new maintainer.
      Issues and pull requests have separate defaults; this overrides whichever is running.
    required: false
    default: ""
  check-duplicates:
    description: "Compare against the titles of other open issues."
    required: false
    default: "true"
  label-threshold:
    description: "Probability the chosen label needs before it is applied."
    required: false
    default: "0.8"
  label-confidence-threshold:
    description: "Confidence the model needs in its own read before a label is applied."
    required: false
    default: "0.6"
  spam-threshold:
    description: "Probability required to mark an issue as spam."
    required: false
    default: "0.9"
  needs-info-threshold:
    description: "Probability required to mark an issue as missing information."
    required: false
    default: "0.85"
  duplicate-threshold:
    description: "Probability required to flag a possible duplicate. Issues only."
    required: false
    default: "0.85"
  risky-threshold:
    description: "Pull requests: probability required to flag a change as expensive to get wrong."
    required: false
    default: "0.8"
  untested-threshold:
    description: "Pull requests: probability required to flag behaviour changed without a test."
    required: false
    default: "0.85"
  undescribed-threshold:
    description: "Pull requests: probability required to flag a description that explains nothing."
    required: false
    default: "0.85"

runs:
  using: "node24"
  main: "src/index.js"
