# hush triaging its own issues, for real. The thresholds below are the defaults;
# a week of dry-run summaries is what earned them.
name: triage
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write

jobs:
  hush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          apply: true
          comment: true
